name: data-update

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ingest recent data
        run: pnpm data:ingest
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: pnpm data:validate
      - name: Open data PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/update-${{ github.run_id }}
          commit-message: "chore(data): update ${{ github.run_started_at }}"
          title: "chore(data): update"
          body: "Automated ingestion of recent matches. Validated with `pnpm data:validate`."
          labels: data
