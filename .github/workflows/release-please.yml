name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # No inputs on purpose: the action then reads release-please-config.json and
      # .release-please-manifest.json (release-type would make it ignore them).
      - uses: googleapis/release-please-action@v4
