name: Feature
description: A new capability for the fan
labels: [feature]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem does it solve for the fan?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / When / Then, verifiable and testable
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
